services:
  happenhere:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: happenhere
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    volumes:
      - "${USERDIR}/docker/happenhere/data:/app/data"
      - "${USERDIR}/docker/happenhere/config.yml:/app/config.yml:ro"
    ports:
      - "${SERVER_IP}:7791:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 1.5

networks:
  frontend:
    external: true
    name: docker_frontend
